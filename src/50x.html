<!doctype html>

<html lang="en-gb">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="robots" content="noindex" />

        <title>Error | Chris Poulter - Web Developer</title>

        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#111827" />
        <link href="/style.css" rel="stylesheet" />

        <script>
            if (
                localStorage.getItem('color-theme') === 'dark' ||
                (!('color-theme' in localStorage) &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
            ) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
    </head>
    <body class="bg-white dark:bg-gray-900">
        <main class="mx-auto max-w-3xl px-4 py-16 text-center">
            <h1
                class="mb-5 text-5xl font-bold text-blue-600 dark:text-blue-500"
            >
                500<br />
                <small
                    class="text-4xl font-semibold text-gray-900 dark:text-white"
                >
                    Internal Server Error
                </small>
            </h1>

            <p class="mb-5 text-lg text-gray-500 dark:text-gray-400">
                Sorry, something went wrong. Please try again later.
            </p>
            <a
                href="/"
                class="inline-block rounded-lg bg-blue-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 focus:outline-hidden dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
                >Back to Homepage</a
            >
        </main>
    </body>
</html>
